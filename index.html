<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jääkaappi-demo</title>
<style>
  :root { --bg: #f6f7f5; --card: #fff; --text: #1d2321; --muted: #6b7470; --accent: #2f7d5b; --border: #dde2df; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141816; --card: #1d2220; --text: #e8ecea; --muted: #9aa49f; --accent: #5cc195; --border: #2e3532; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border);
         border-radius: 16px; padding: 24px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  #msg { font-weight: 600; }
  a { color: var(--accent); font-weight: 600; }
  .about { color: var(--muted); font-size: .95rem; margin-bottom: 0; }
</style>
</head>
<body>
<main>
  <h1>Jääkaappi-demo</h1>
  <p id="msg">Avataan demoa…</p>
  <p><a id="link" hidden>Jos demo ei aukea, napauta tästä</a></p>
  <p class="about">Tekoäly tunnistaa kameralla jääkaappiin laitetut tuotteet ja ehdottaa niistä reseptejä.</p>
</main>
<script>
// Ohjaa demokoneen tunneliin. Osoite on tunnel.json-tiedostossa, joka haetaan aina tuoreena (ei välimuistista),
// joten uusi osoite toimii heti GitHub Pagesin julkaisun jälkeen. Tämä sivu itse ei muutu.
// Vain Cloudflaren pikatunnelin juuriosoite kelpaa: ylläpitäjän linkki ei voi päätyä tänne.
const TUNNEL = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
const msg = document.getElementById('msg'), link = document.getElementById('link');
fetch('tunnel.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(d => {
    const url = String(d.url || '').trim().replace(/\/+$/, '');
    if (!TUNNEL.test(url)) throw new Error('ei osoitetta');
    link.href = url;
    link.hidden = false;
    location.replace(url);
  })
  .catch(() => { msg.textContent = 'Demo ei ole juuri nyt käynnissä.'; });
</script>
</body>
</html>
